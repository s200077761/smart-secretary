# Render.com deployment configuration
# Free tier: 512 MB RAM, spins down after 15 min inactivity
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: smart-secretary-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: ./firebase-credentials.json
      - key: SERVER_URL
        fromService:
          type: web
          name: smart-secretary-api
          property: host
