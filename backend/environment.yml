# Anaconda environment for Smart Secretary backend
# Usage:
#   conda env create -f environment.yml
#   conda activate smart-secretary
#   uvicorn app.main:app --reload

name: smart-secretary
channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pip:
    - fastapi==0.115.5
    - uvicorn[standard]==0.32.1
    - langchain==0.3.7
    - langchain-google-genai==2.0.7
    - google-generativeai==0.8.3
    - firebase-admin==6.6.0
    - python-telegram-bot==21.6
    - httpx==0.27.2
    - aiohttp==3.11.9
    - twilio==9.3.7
    - pydantic==2.10.3
    - pydantic-settings==2.6.1
    - python-dotenv==1.0.1
