name: Deploy to Expo

on:
  push:
    branches: ["claude/clone-manus-ai-agent-7VoYc", "main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Deploy to Expo (uses pre-built dist/ folder)
        run: eas deploy --prod --non-interactive --export-dir=dist
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
