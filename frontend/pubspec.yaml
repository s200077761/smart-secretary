name: smart_secretary
description: "السكرتير الذكي — AI-powered personal assistant (Flutter)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # ── Google Sign-In ────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── State management ─────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── HTTP / API ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # ── UI ────────────────────────────────────────────────────────────────────
  flutter_markdown: ^0.7.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # ── Localization ──────────────────────────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # ── Storage / prefs ───────────────────────────────────────────────────────
  shared_preferences: ^2.3.3

  # ── Icons ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
